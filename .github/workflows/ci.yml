name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    env:
      # Keep in step with production. The sync runs under Node 22 on the VPS
      # (systemd/rondo-sync-web.service), so that is what the suite is proved
      # against — local development on a newer Node is not what ships.
      NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # better-sqlite3 is a native module; npm ci builds or fetches a prebuild
      # for this Node version, which is itself worth catching on a bump.
      - name: Install dependencies
        run: npm ci

      # Playwright is a dependency but no test drives a browser, so its browser
      # binaries are deliberately not installed here.
      - name: Run the test suite
        run: npm test
